[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-surveillance"
version = "0.1.0"
description = "Production-style prototype for unusual trade detection + outlier visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "streamlit>=1.41",
  "plotly>=5.24",
]

[project.optional-dependencies]
embeddings = [
  "umap-learn>=0.5.5",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6.9",
]

[tool.setuptools]
packages = ["trade_surveillance"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
